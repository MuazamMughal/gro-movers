x-app: &app
    build:
        context: './vendor/laravel/sail/runtimes/8.3'
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP}'
    image: 'sail-8.3/app'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    volumes:
        - '.:/var/www/html'
    networks:
        - sail
    depends_on:
        mysql:
            condition: service_healthy
        mailpit:
            condition: service_started

services:
    laravel.test:
        <<: *app
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'

    # Processes queued jobs (lead emails, static page rebuilds).
    queue:
        <<: *app
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            # Loop so `artisan queue:restart` (a clean exit after deploys/code changes) starts a fresh worker.
            SUPERVISOR_PHP_COMMAND: '/bin/sh -c "while true; do /usr/bin/php /var/www/html/artisan queue:work --tries=3 --timeout=120; sleep 1; done"'
        restart: unless-stopped

    # Runs the Laravel scheduler (scheduled posts, backups) - mirrors the cPanel cron.
    scheduler:
        <<: *app
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php /var/www/html/artisan schedule:work'
        restart: unless-stopped

    # cPanel-like Apache + mod_php to test public/.htaccess (static cache rules).
    # Start with: make apache (docker compose --profile apache up -d apache) -> http://localhost:8080
    apache:
        profiles: ['apache']
        build:
            context: './docker/apache'
        ports:
            - '${APACHE_PORT:-8080}:80'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: 'mysql:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 10
            interval: 5s
            timeout: 5s
            # First boot initializes the data directory, which can take ~1 minute.
            start_period: 90s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
